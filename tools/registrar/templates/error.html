{% extends "base.html" %}
{% set title = title or "Error" %}

{% block content %}
  <section class="card">
    <h1>{{ title }}</h1>
    <div class="alert alert--error">
      {{ detail }}
    </div>

    {% if extra %}
      <pre class="code">{{ extra | tojson(indent=2) }}</pre>
    {% endif %}

    <div class="actions">
      <a class="btn btn--ghost" href="/">Back to form</a>
    </div>
  </section>
{% endblock %}
