<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registry Record — The Stellar Registry Committee</title>
  <meta name="robots" content="noindex" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;line-height:1.5}
    header,main,footer{max-width:920px;margin:0 auto;padding:24px}
    header{border-bottom:1px solid #e6e6e6}
    footer{border-top:1px solid #e6e6e6;color:#555;font-size:14px}
    .muted{color:#666}
    code{background:#f5f5f5;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <header>
    <div class="muted">The Stellar Registry Committee</div>
    <h1 style="margin:8px 0 0 0;">Registry Record</h1>
  </header>

  <main>
    <p class="muted" style="margin-top:0;">
      Private commemorative registry record (not affiliated with the IAU).
    </p>
    <p id="internalNotice" style="display:none; color:#666; margin-top:0;">
      Internal renderer endpoint. Use <code>/registry/&lt;ID&gt;</code> or <code>/r/&lt;ID&gt;</code>.
    </p>

    <p>Record ID: <code id="rid">—</code></p>
    <p class="muted">Next step: load data from <code>/data/entries/&lt;ID&gt;.json</code>.</p>
  </main>

  <footer>
    <a href="/" class="muted">Home</a>
  </footer>

  <script>
(function () {
  function $(id) { return document.getElementById(id); }

  // Show internal notice when someone visits /__app/* directly
  if (location.pathname.startsWith("/__app/")) {
    var n = $("internalNotice");
    if (n) n.style.display = "block";
  }

  function getIdFromPath() {
    var parts = location.pathname.split("/").filter(Boolean); // ["registry","<ID>"]
    return (parts[0] === "registry" && parts[1]) ? parts[1] : "";
  }

  function safeText(x) { return (x === undefined || x === null) ? "" : String(x); }

  var id = getIdFromPath();
  $("rid").textContent = id || "—";

  // If user is on /__app/registry (no ID), stop here.
  if (!id) return;

  var url = "/data/entries/" + encodeURIComponent(id) + ".json";

  fetch(url, { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("Entry not found (" + r.status + ")");
      return r.json();
    })
    .then(function (entry) {
      var block = document.createElement("div");
      block.style.marginTop = "16px";
      block.innerHTML = ""
        + "<h2 style='margin:16px 0 8px;'>Record Details</h2>"
        + "<p><strong>Designation:</strong> " + safeText(entry.designation && entry.designation.title) + "</p>"
        + "<p><strong>Epoch:</strong> " + safeText(entry.object && entry.object.coordinates && entry.object.coordinates.epoch) + "</p>"
        + "<p><strong>RA:</strong> " + safeText(entry.object && entry.object.coordinates && entry.object.coordinates.ra_hms) + "</p>"
        + "<p><strong>Dec:</strong> " + safeText(entry.object && entry.object.coordinates && entry.object.coordinates.dec_dms) + "</p>"
        + "<p><strong>SAO:</strong> " + safeText((entry.object && entry.object.catalog && entry.object.catalog[0] && entry.object.catalog[0].scheme === "SAO") ? entry.object.catalog[0].id : "") + "</p>";

      document.querySelector("main").appendChild(block);
    })
    .catch(function () {
      var msg = document.createElement("p");
      msg.style.marginTop = "16px";
      msg.className = "muted";
      msg.textContent = "No registry data file found for this ID yet.";
      document.querySelector("main").appendChild(msg);
    });
})();
</script>


</body>
</html>
