<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resolver — The Stellar Registry Committee</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;line-height:1.5}
    main{max-width:920px;margin:0 auto;padding:24px}
    input,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #ccc}
    button{cursor:pointer}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .muted{color:#666}
  </style>
</head>
<body>
  <main>
    <h1>Resolver</h1>
    <p class="muted">QR codes point to <code>/r/&lt;ID&gt;</code> and redirect to the canonical record at <code>/registry/&lt;ID&gt;</code>.</p>

    <form class="row" onsubmit="return go(event)">
      <input id="id" placeholder="Enter Record ID (e.g., EXAMPLE-0001)" size="32" />
      <button type="submit">Resolve</button>
    </form>

    <script>
      function go(e){
        e.preventDefault();
        var id = document.getElementById('id').value.trim();
        if(!id) return false;
        location.href = '/r/' + encodeURIComponent(id);
        return false;
      }
    </script>
  </main>
</body>
</html>
