<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sky viewer</title>

  <!-- Aladin Lite v3 (CDS) -->
  <link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.css" />
  <script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js"></script>

  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    #aladin { position: fixed; inset: 0; }
    .hud{
      position: fixed; left: 12px; top: 10px; z-index: 9999;
      color: rgba(255,255,255,0.88);
      font: 12px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      padding: 8px 10px;
      backdrop-filter: blur(6px);
      max-width: min(680px, calc(100vw - 24px));
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hud code { color: rgba(255,255,255,0.95); }
  </style>
</head>

<body>
  <div id="aladin"></div>
  <div class="hud" id="hud">
    Cargando… (ejemplos: <code>?target=Vega&fov=55</code> | <code>?ra=279.2347&dec=38.7837&fov=55</code>)
  </div>

  <script>
    // URL params:
    //  ?target=Vega&fov=55
    //  ?ra=279.2347&dec=38.7837&fov=55
    // Optional:
    //  &survey=P/DSS2/color
    //  &bright=10      (0 desactiva)
    //  &order=V        (col de magnitud; V común; a veces G funciona)
    //  &radius=20      (radio del cono en grados; si no, se estima)
    //  &lines=1        (0 desactiva líneas)

    const p = new URLSearchParams(location.search);

    const fov = Number(p.get("fov") ?? "55");                 // más grande = menos zoom
    const survey = p.get("survey") ?? "P/DSS2/color";

    const ra = p.get("ra");
    const dec = p.get("dec");
    const target =
      p.get("target") ??
      ((ra && dec) ? `${ra} ${dec}` : "Vega");

    const brightLimit = Number(p.get("bright") ?? "10");
    const orderBy = p.get("order") ?? "V";
    const linesOn = (p.get("lines") ?? "1") !== "0";

    // Radio del cono: lo hacemos suficientemente grande para que el “borde del círculo”
    // quede fuera de pantalla en la mayoría de casos.
    const radiusWanted = Number(p.get("radius") ?? String(Math.min(Math.max(fov * 0.75, 8), 60)));

    function setHud(text){
      const hud = document.getElementById("hud");
      hud.textContent = text;
    }

    // Si por alguna razón no cargó Aladin, lo avisamos.
    if (!window.A) {
      setHud("ERROR: No cargó Aladin Lite (revisa que aladin.js/aladin.css no estén 404).");
      throw new Error("Aladin Lite not loaded");
    }

    A.init.then(() => {
      const aladin = A.aladin("#aladin", {
        target,
        fov,
        survey,
        cooFrame: "ICRS",
        showCooGrid: true,
        showSimbadPointerControl: true,
        showLayersControl: true,
        showGotoControl: true
      });

      // Constellation lines overlay (HiPS)
      if (linesOn) {
        const constLines = aladin.newImageSurvey("JAXA/P/CONSTELLATIONS/Image/Lines");
        aladin.setOverlayImageLayer(constLines, "constellation-lines");
        try { constLines.setAlpha(0.85); } catch (e) {}
      }

      // Brightest stars (SIMBAD) — limit to N, sorted by magnitude (smaller = brighter)
      if (brightLimit > 0) {
        function addBright(radiusDeg) {
          A.catalogFromSimbad(
            target,
            radiusDeg,
            {
              name: `Top ${brightLimit} brightest`,
              onClick: "showPopup",
              sourceSize: 12,

              // “Nombres”: esto muestra el identificador principal de SIMBAD.
              // En estrellas famosas suele ser el nombre propio (Vega/Deneb/etc).
              labelColumn: "main_id",
              labelFont: "13px sans-serif",

              limit: brightLimit,
              orderBy: orderBy,
              orderDir: "ASC",
              verbosity: 2
            },
            (cat) => {
              aladin.addCatalog(cat);
              setHud(`OK — target=${target} — fov=${fov}° — survey=${survey} — bright=${brightLimit} (order ${orderBy}) — radius=${radiusDeg}°`);
            },
            (err) => {
              console.warn("SIMBAD cone failed:", err);
              // fallback por si el radio es demasiado grande para SIMBAD
              if (radiusDeg > 10) addBright(10);
              else setHud(`OK (sin SIMBAD) — target=${target} — fov=${fov}° — survey=${survey}`);
            }
          );
        }

        addBright(radiusWanted);
      } else {
        setHud(`OK — target=${target} — fov=${fov}° — survey=${survey} — (sin catálogo)`);
      }
    });
  </script>
</body>
</html>
