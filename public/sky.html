<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
  <title>Sky</title>

  <!-- Aladin Lite v3 (CDS) -->
  <link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.css" />
  <script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js"></script>

  <style>
    html, body { margin:0; height:100%; background:#000; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #aladin { position:absolute; inset:0; }
    #hud{
      position: fixed; left: 8px; top: 8px; z-index: 9999;
      background: rgba(0,0,0,.55); color: #fff;
      padding: 6px 10px; border-radius: 10px;
      font-size: 12px; line-height: 1.25;
      max-width: min(720px, calc(100vw - 16px));
      backdrop-filter: blur(4px);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="hud">Cargando…</div>
  <div id="aladin"></div>

  <script>
  (function () {
    const hud = document.getElementById("hud");
    const setHud = (t) => hud.textContent = t;

    const p = new URLSearchParams(location.search);

    // Menos zoom = FOV más grande
    const fov = Number(p.get("fov") ?? "55");
    const survey = p.get("survey") ?? "P/DSS2/color";

    // Centro del mapa (para pruebas). Si no pasas nada, centramos en Vega.
    // Puedes pasar ?target=Vega o ?ra=...&dec=...
    const raQ = p.get("ra");
    const decQ = p.get("dec");
    const target =
      p.get("target") ??
      ((raQ && decQ) ? `${raQ} ${decQ}` : "Vega");

    // Vega fijo (lo que nos pediste):
    // RA 18h 36m 56s = 279.233333°
    // Dec +38° 47'   = +38.783333°
    const VEGA_RA_DEG  = 279.23333333333335;
    const VEGA_DEC_DEG = 38.78333333333333;

    if (!window.A) {
      setHud("ERROR: No cargó Aladin Lite (aladin.js/aladin.css).");
      return;
    }

    A.init.then(() => {
      const aladin = A.aladin("#aladin", {
        target,
        fov,
        survey,
        cooFrame: "ICRS",
        projection: "SIN",
        showReticle: true,
        showCooGrid: true,
        showLayersControl: true,
        showGotoControl: true,
        showZoomControl: true,
        showFullscreenControl: true,
        showShareControl: true
      });

      // --- Constellation lines overlay (HiPS) ---
      // Esto “regresa” las líneas aunque otras opciones internas fallen.
      const constLines = aladin.newImageSurvey("JAXA/P/CONSTELLATIONS/Image/Lines");
      aladin.setOverlayImageLayer(constLines, "constellation-lines");
      try { constLines.setAlpha(0.90); } catch (e) {}

      // --- ÚNICO label manual: "Vega" ---
      const vegaCat = A.catalog({
        name: "Manual label",
        color: "#ffffff",
        shape: "circle",
        sourceSize: 14,
        onClick: "showPopup",

        // Labels:
        displayLabel: true,
        labelColumn: "name",
        labelColor: "rgba(255,255,255,0.95)",
        labelFont: "16px sans-serif"
      });

      vegaCat.addSources([
        A.source(VEGA_RA_DEG, VEGA_DEC_DEG, { name: "Vega" })
      ]);

      aladin.addCatalog(vegaCat);

      setHud(`OK — líneas de constelación ON — label manual: Vega — fov=${fov}° — survey=${survey}`);
    });
  })();
  </script>
</body>
</html>
