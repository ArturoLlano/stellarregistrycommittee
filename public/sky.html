<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
  <title>Sky</title>

  <!-- Aladin Lite v3 (CDS) -->
  <link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.css" />
  <script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js"></script>

  <style>
    html, body { margin:0; height:100%; background:#000; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #aladin { position:absolute; inset:0; }
    #hud{
      position: fixed; left: 8px; top: 8px; z-index: 9999;
      background: rgba(0,0,0,.55); color: #fff;
      padding: 6px 10px; border-radius: 10px;
      font-size: 12px; line-height: 1.25;
      max-width: min(720px, calc(100vw - 16px));
      backdrop-filter: blur(4px);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="hud">Cargando…</div>
  <div id="aladin"></div>

  <script>
  (function () {
    const hud = document.getElementById("hud");
    const setHud = (t) => hud.textContent = t;

    const p = new URLSearchParams(location.search);

    // Menos zoom = FOV más grande
    const fov = Number(p.get("fov") ?? "55");
    const survey = p.get("survey") ?? "P/DSS2/color";

    // Centro del mapa: puedes pasar ?target=... o ?ra=...&dec=...
    const raQ = p.get("ra");
    const decQ = p.get("dec");
    const target =
      p.get("target") ??
      ((raQ && decQ) ? `${raQ} ${decQ}` : "Vega");

    // ==== LISTA DE ESTRELLAS MANUALES ====
    // RA/Dec en GRADOS (ICRS/J2000 aprox)
    const MANUAL_STARS = [
      { name: "Vega",   ra: 279.23333333333335, dec:  38.78333333333333 },
      { name: "Deneb",  ra: 310.35791666666665, dec:  45.280277777777776 },
      { name: "Altair", ra: 297.6958333333333,  dec:   8.868333333333334 }
    ];

    // ==== LABELS DE CONSTELACIONES (SIN MARCADOR) ====
    // Cygnus punto medio que nos diste:
    // RA mid = 308.82°, Dec mid = 44.545°
    const CONSTELLATION_LABELS = [
      { name: "C Y G N U S", ra: 308.82, dec: 44.545 }
    ];

    if (!window.A) {
      setHud("ERROR: No cargó Aladin Lite (aladin.js/aladin.css).");
      return;
    }

    A.init.then(() => {
      const aladin = A.aladin("#aladin", {
        target,
        fov,
        survey,
        cooFrame: "ICRS",
        projection: "SIN",

        showReticle: true,
        showCooGrid: true,
        showLayersControl: true,
        showGotoControl: true,
        showZoomControl: true,
        showFullscreenControl: true,
        showShareControl: true
      });

      // --- Líneas de constelaciones (overlay HiPS) ---
      const constLines = aladin.newImageSurvey("JAXA/P/CONSTELLATIONS/Image/Lines");
      aladin.setOverlayImageLayer(constLines, "constellation-lines");
      try { constLines.setAlpha(0.90); } catch (e) {}

      // --- Catálogo manual: estrellas con marcador + label ---
      const starCat = A.catalog({
        name: "Manual stars",
        color: "#ffffff",
        shape: "circle",
        sourceSize: 14,
        onClick: "showPopup",

        displayLabel: true,
        labelColumn: "name",
        labelColor: "rgba(255,255,255,0.95)",
        labelFont: "16px sans-serif"
      });

      for (const s of MANUAL_STARS) {
        starCat.addSources([ A.source(s.ra, s.dec, { name: s.name }) ]);
      }

      aladin.addCatalog(starCat);

      // --- Labels manuales de constelación: SIN marcador ---
      const constCat = A.catalog({
        name: "Constellation labels",
        // marcador invisible:
        sourceSize: 0,
        shape: "circle",
        color: "rgba(0,0,0,0)",

        // label visible:
        displayLabel: true,
        labelColumn: "name",
        labelColor: "rgba(255,255,255,0.90)",
        labelFont: "22px sans-serif",

        onClick: "showPopup"
      });

      for (const c of CONSTELLATION_LABELS) {
        constCat.addSources([ A.source(c.ra, c.dec, { name: c.name }) ]);
      }

      aladin.addCatalog(constCat);

      setHud(`OK — líneas ON — estrellas: ${MANUAL_STARS.length} — const labels: ${CONSTELLATION_LABELS.length} — fov=${fov}°`);
    });
  })();
  </script>
</body>
</html>
