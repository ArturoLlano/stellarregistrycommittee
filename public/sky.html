<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
  <title>Sky</title>

  <!-- Aladin Lite v3 (CDS) -->
  <link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.css" />
  <script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js"></script>

  <style>
    html, body { margin:0; height:100%; background:#000; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #aladin { position:absolute; inset:0; }
    #hud{
      position: fixed; left: 8px; top: 8px; z-index: 9999;
      background: rgba(0,0,0,.55); color: #fff;
      padding: 6px 10px; border-radius: 10px;
      font-size: 12px; line-height: 1.25;
      max-width: min(860px, calc(100vw - 16px));
      backdrop-filter: blur(4px);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="hud">Cargando…</div>
  <div id="aladin"></div>

  <script>
  (function () {
    const hud = document.getElementById("hud");
    const setHud = (t) => hud.textContent = t;

    const p = new URLSearchParams(location.search);

    // Viewer params
    const fov = toNum(p.get("fov"), 55);
    // const survey = p.get("survey") ?? "P/DSS2/color";
    const survey = p.get("survey") ?? "P/Mellinger/color";

    // Toggles
    const showStars = (p.get("stars") ?? "1") !== "0";
    const showConstLabels = (p.get("const") ?? "1") !== "0";
    const showLines = (p.get("lines") ?? "1") !== "0";

    // Density controls
    const magLimit = toNum(p.get("mag"), null);     // e.g. 2.5  -> keep mag_v <= 2.5
    const maxStars = clampInt(toInt(p.get("max"), 200), 1, 2000);

    // Center: allow ?target=... or ?ra=...&dec=...
    const raQ = p.get("ra");
    const decQ = p.get("dec");
    const target =
      p.get("target") ??
      ((raQ && decQ) ? `${raQ} ${decQ}` : "Vega");

    // Data locations (relative URLs)
    const STARS_CSV_URL = "/data/entries/maps/stars.csv";
    const CONST_CSV_URL = "/data/entries/maps/constellations.csv";

    if (!window.A) {
      setHud("ERROR: No cargó Aladin Lite (aladin.js/aladin.css).");
      return;
    }

    A.init.then(async () => {
      const aladin = A.aladin("#aladin", {
        target,
        fov,
        survey,
        cooFrame: "ICRS",
        projection: "SIN",
        showReticle: true,
        showCooGrid: true,
        showLayersControl: true,
        showGotoControl: true,
        showZoomControl: true,
        showFullscreenControl: true,
        showShareControl: true
      });

      // --- Constellation lines overlay (HiPS) ---
      if (showLines) {
        const constLines = aladin.newImageSurvey("JAXA/P/CONSTELLATIONS/Image/Lines");
        aladin.setOverlayImageLayer(constLines, "constellation-lines");
        try { constLines.setAlpha(0.90); } catch (e) {}
      }

      // Load data (CSV) in parallel
      const tasks = [];
      if (showStars) tasks.push(loadCsv(STARS_CSV_URL).then(rows => ({ kind: "stars", rows })));
      if (showConstLabels) tasks.push(loadCsv(CONST_CSV_URL).then(rows => ({ kind: "const", rows })));

      let results;
      try {
        results = await Promise.all(tasks);
      } catch (err) {
        console.error(err);
        setHud("ERROR: No pude cargar los CSV (revisa rutas en /data/entries/maps/).");
        return;
      }

      // --- Render stars (marker + label) ---
      if (showStars) {
        const starsRes = results.find(r => r.kind === "stars");
        const stars = normalizeStars(starsRes?.rows ?? []);

        // Filter by magnitude if provided
        const filtered = (magLimit === null)
          ? stars
          : stars.filter(s => Number.isFinite(s.mag_v) ? (s.mag_v <= magLimit) : false);

        // Sort: brightest first
        filtered.sort((a, b) => (a.mag_v ?? 99) - (b.mag_v ?? 99));

        // Cap
        const finalStars = filtered.slice(0, maxStars);

        const starCat = A.catalog({
          name: "Stars",
          color: "#ffffff",
          shape: "circle",
          sourceSize: 14,
          onClick: "showPopup",

          displayLabel: true,
          labelColumn: "name",
          labelColor: "rgba(255,255,255,0.95)",
          labelFont: "14px sans-serif"
        });

        // Add sources
        for (const s of finalStars) {
          starCat.addSources([ A.source(s.ra_deg, s.dec_deg, { name: s.name, mag_v: s.mag_v }) ]);
        }

        aladin.addCatalog(starCat);
      }

      // --- Render constellation labels (label-only) ---
      if (showConstLabels) {
        const constRes = results.find(r => r.kind === "const");
        const consts = normalizeConstellations(constRes?.rows ?? []);

        const constCat = A.catalog({
          name: "Constellations",
          sourceSize: 0,                    // no marker
          shape: "circle",
          color: "rgba(0,0,0,0)",

          displayLabel: true,
          labelColumn: "name",
          labelColor: "rgba(255,255,255,0.90)",
          labelFont: "20px sans-serif",
          onClick: "showPopup"
        });

        for (const c of consts) {
          constCat.addSources([ A.source(c.ra_deg, c.dec_deg, { name: c.name }) ]);
        }

        aladin.addCatalog(constCat);
      }

      // HUD summary
      const hudBits = [];
      hudBits.push(`OK`);
      hudBits.push(`fov=${fov}°`);
      if (showLines) hudBits.push(`lines=on`);
      if (showStars) hudBits.push(`stars=on${magLimit!==null ? ` (mag<=${magLimit})` : ""}, max=${maxStars}`);
      if (showConstLabels) hudBits.push(`const=on`);
      setHud(hudBits.join(" — "));
    });

    // ---------- CSV helpers ----------
    async function loadCsv(url) {
      // cache-bust in dev if you want: add ?_t=...
      const res = await fetch(url, { cache: "no-cache" });
      if (!res.ok) throw new Error(`CSV fetch failed: ${url} (${res.status})`);
      const text = await res.text();
      return parseCsv(text);
    }

    function parseCsv(text) {
      // Simple CSV parser: handles commas + quoted fields.
      const lines = text.replace(/\r/g, "").split("\n").filter(l => l.trim() && !l.trim().startsWith("#"));
      if (!lines.length) return [];

      const header = splitCsvLine(lines[0]).map(h => h.trim());
      const rows = [];

      for (let i = 1; i < lines.length; i++) {
        const cols = splitCsvLine(lines[i]);
        if (!cols.length) continue;
        const obj = {};
        for (let j = 0; j < header.length; j++) obj[header[j]] = (cols[j] ?? "").trim();
        rows.push(obj);
      }
      return rows;
    }

    function splitCsvLine(line) {
      const out = [];
      let cur = "";
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const ch = line[i];

        if (ch === '"' ) {
          if (inQuotes && line[i+1] === '"') { cur += '"'; i++; }
          else inQuotes = !inQuotes;
          continue;
        }

        if (ch === "," && !inQuotes) {
          out.push(cur);
          cur = "";
          continue;
        }

        cur += ch;
      }
      out.push(cur);
      return out;
    }

    // ---------- Normalizers ----------
    function normalizeStars(rows) {
      // expected: name, ra_deg, dec_deg, mag_v
      const out = [];
      for (const r of rows) {
        const name = (r.name ?? "").trim();
        const ra_deg = toNum(r.ra_deg, NaN);
        const dec_deg = toNum(r.dec_deg, NaN);
        const mag_v = toNum(r.mag_v, NaN);

        if (!name || !Number.isFinite(ra_deg) || !Number.isFinite(dec_deg)) continue;
        out.push({ name, ra_deg, dec_deg, mag_v: Number.isFinite(mag_v) ? mag_v : null });
      }
      return out;
    }

    function normalizeConstellations(rows) {
      // expected: name, ra_deg, dec_deg
      const out = [];
      for (const r of rows) {
        const name = (r.name ?? "").trim();
        const ra_deg = toNum(r.ra_deg, NaN);
        const dec_deg = toNum(r.dec_deg, NaN);
        if (!name || !Number.isFinite(ra_deg) || !Number.isFinite(dec_deg)) continue;
        out.push({ name, ra_deg, dec_deg });
      }
      return out;
    }

    // ---------- Small utils ----------
    function toNum(v, fallback) {
      if (v === null || v === undefined || v === "") return fallback;
      const n = Number(String(v).trim());
      return Number.isFinite(n) ? n : fallback;
    }
    function toInt(v, fallback) {
      if (v === null || v === undefined || v === "") return fallback;
      const n = parseInt(String(v).trim(), 10);
      return Number.isFinite(n) ? n : fallback;
    }
    function clampInt(n, a, b) {
      return Math.min(b, Math.max(a, n));
    }
  })();
  </script>
</body>
</html>
