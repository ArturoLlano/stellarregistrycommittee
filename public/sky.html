<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sky viewer</title>

  <!-- Aladin Lite v3 -->
  <link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.min.css" />
  <script defer src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.min.js"></script>

  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    #aladin { position: fixed; inset: 0; }
    .hud {
      position: fixed;
      left: 12px;
      top: 10px;
      z-index: 9999;
      color: rgba(255,255,255,0.85);
      font: 12px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 8px 10px;
      backdrop-filter: blur(6px);
      max-width: min(520px, calc(100vw - 24px));
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hud b { color: #fff; }
    .hud code { color: rgba(255,255,255,0.9); }
  </style>
</head>

<body>
  <div id="aladin"></div>
  <div class="hud" id="hud"></div>

  <script>
    // --- Helpers ---
    function qs(name, fallback = null) {
      const v = new URLSearchParams(location.search).get(name);
      return (v === null || v === "") ? fallback : v;
    }
    function toNum(v, fallback) {
      const n = Number(v);
      return Number.isFinite(n) ? n : fallback;
    }

    // --- URL params ---
    // Puedes usar:
    //   /sky?target=Vega&fov=90
    //   /sky?ra=279.2347&dec=38.7837&fov=90
    const target = qs("target", "Vega");
    const ra = qs("ra", null);
    const dec = qs("dec", null);

    // Menos zoom => fov más grande (grados)
    const fov = toNum(qs("fov", "90"), 90);

    // Para no “ver” el borde circular del cono, usamos un radio > (fov/2)
    // Con esto el borde normalmente queda fuera del viewport.
    const coneRadiusDeg = Math.min(60, Math.max(5, fov * 0.75));

    // --- Init Aladin ---
    window.A.init.then(() => {
      const aladin = A.aladin('#aladin', {
        // Si viene ra/dec, usamos eso; si no, usamos target (nombre resolvible)
        target: (ra !== null && dec !== null)
          ? { ra: toNum(ra, 279.23473479), dec: toNum(dec, 38.78368896) }
          : target,
        fov: fov,
        cooFrame: "ICRS",
        fullScreen: true,
        showCooGrid: true,
        showFrame: true,
        showContextMenu: true,
        reticleColor: "rgb(178, 50, 178)"
      });

      // Base sky background (bonito para ver Vía Láctea)
      aladin.setBaseImageLayer(aladin.newImageSurvey('P/Mellinger/color'));

      // Constellation lines overlay (HiPS)
      const constLines = aladin.newImageSurvey('JAXA/P/CONSTELLATIONS/Image/Lines');
      aladin.setOverlayImageLayer(constLines, "constellations");
      // Ajusta opacidad si quieres más/menos “marcado”
      aladin.getOverlayImageLayer("constellations").setOpacity(0.85);

      // Catalog: 10 brightest (SIMBAD), labeled
      const catBright = A.catalogFromSimbad(
        (ra !== null && dec !== null)
          ? { ra: toNum(ra, 279.23473479), dec: toNum(dec, 38.78368896) }
          : target,
        coneRadiusDeg,
        {
          name: "Brightest stars (SIMBAD)",
          shape: "circle",
          color: "#2aa1ff",
          sourceSize: 10,
          onClick: "showPopup",

          // Labels (nombres)
          labelColumn: "main_id",
          labelColor: "rgba(255,255,255,0.92)",
          labelFont: "14px sans-serif",

          // Limit + sort by V magnitude (brightest first)
          limit: 10,
          orderBy: "V",
          orderDir: "ASC",
          // verbosity 2 suele traer magnitudes/cols útiles (depende del servicio)
          verbosity: 2
        },
        function(sources) {
          // HUD info
          const center = aladin.getRaDec();
          const hud = document.getElementById("hud");
          const centerTxt = `${center[0].toFixed(4)}, ${center[1].toFixed(4)}`;
          const where = (ra !== null && dec !== null) ? `ra=${ra}, dec=${dec}` : `target=${target}`;
          hud.textContent = `Sky viewer — ${where} — fov=${fov}° — SIMBAD brightest loaded: ${sources.length} — center=${centerTxt}`;
        }
      );
      aladin.addCatalog(catBright);

      // Tip: si quieres que el usuario pueda hacer zoom out sin pasarse:
      // aladin.setFovRange(0.2, 180);
    });
  </script>
</body>
</html>
