<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
  <title>Sky</title>

  <style>
    html, body { margin:0; height:100%; background:#000; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #aladin { position:absolute; inset:0; }

    #hud{
      position: fixed; left: 8px; top: 8px; z-index: 9999;
      background: rgba(0,0,0,.55); color: #fff;
      padding: 6px 10px; border-radius: 10px;
      font-size: 12px; line-height: 1.25;
      max-width: min(860px, calc(100vw - 16px));
      backdrop-filter: blur(4px);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
  </style>
</head>

<body>
  <div id="hud">Cargando…</div>
  <div id="aladin"></div>

  <!-- Aladin Lite v3 (CDS) — NO uses aladin.css (ya no existe) -->
  <script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>

  <script>
  (() => {
    "use strict";

    const hud = document.getElementById("hud");
    const setHud = (t) => { if (hud) hud.textContent = t; };

    // Captura errores (si algo truena, lo verás en el HUD)
    window.addEventListener("error", (e) => {
      console.error(e);
      setHud("ERROR JS: " + (e.message || "error"));
    });
    window.addEventListener("unhandledrejection", (e) => {
      console.error(e.reason);
      setHud("ERROR PROMISE: " + (e.reason?.message || String(e.reason || "promise rejected")));
    });

    const p = new URLSearchParams(location.search);

    // HUD visible solo si ?hud=1 (para producción queda silencioso por default)
    const showHud = (p.get("hud") ?? "0") !== "0";
    if (!showHud && hud) hud.style.display = "none";

    const toNum = (v, d) => {
      const n = Number(v);
      return Number.isFinite(n) ? n : d;
    };

    const isMobile = matchMedia("(max-width: 760px)").matches || ("ontouchstart" in window);
    const fov = (p.get("fov") !== null && p.get("fov") !== "")
      ? toNum(p.get("fov"), 40)
      : (isMobile ? 15 : 40);

    // Default “bonito” pero estable: puedes forzar DSS2 con ?survey=P/DSS2/color
    const survey = p.get("survey") ?? "CDS/P/Mellinger/color";

    const raQ = p.get("ra");
    const decQ = p.get("dec");
    const target =
      p.get("target") ??
      ((raQ && decQ) ? `${raQ} ${decQ}` : "Vega");

    const idParam = p.get("id");

    // Helpers: convertir "03 11 42.317" -> grados
    function raHmsToDeg(s) {
      if (!s) return null;
      const parts = String(s).trim().replace(/:/g, " ").split(/\s+/);
      if (parts.length < 3) return null;
      const h = Number(parts[0]), m = Number(parts[1]), sec = Number(parts[2]);
      if (![h,m,sec].every(Number.isFinite)) return null;
      return (h + (m/60) + (sec/3600)) * 15;
    }

    // Helpers: "+81 15 49.76" -> grados
    function decDmsToDeg(s) {
      if (!s) return null;
      const txt = String(s).trim().replace(/:/g, " ");
      const sign = txt.startsWith("-") ? -1 : 1;
      const clean = txt.replace(/^[-+]/, "");
      const parts = clean.split(/\s+/);
      if (parts.length < 3) return null;
      const d = Number(parts[0]), m = Number(parts[1]), sec = Number(parts[2]);
      if (![d,m,sec].every(Number.isFinite)) return null;
      return sign * (d + (m/60) + (sec/3600));
    }

    async function centerOnEntry(aladin, id) {
      const url = `/data/entries/${encodeURIComponent(id)}.json?_ts=${Date.now()}`;
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error(`No se pudo cargar entry JSON (${r.status})`);

      const entry = await r.json();

      // soporta entry.object.coordinates.* (tu esquema) y entry.coordinates.* (por compat)
      const coo = entry?.object?.coordinates || entry?.coordinates || {};
      const ra_hms = coo.ra_hms || entry?.ra_hms || null;
      const dec_dms = coo.dec_dms || entry?.dec_dms || null;

      // si no hay grados, intentamos convertir de HMS/DMS
      const ra_deg = (typeof coo.ra_deg === "number") ? coo.ra_deg : raHmsToDeg(ra_hms);
      const dec_deg = (typeof coo.dec_deg === "number") ? coo.dec_deg : decDmsToDeg(dec_dms);

      if (Number.isFinite(ra_deg) && Number.isFinite(dec_deg)) {
        aladin.gotoRaDec(ra_deg, dec_deg);
        // marcador simple
        const cat = A.catalog({ name: "Record", color: "#ffffff", sourceSize: 14, onClick: "showPopup" });
        aladin.addCatalog(cat);
        cat.addSources([ A.source(ra_deg, dec_deg, { name: id }) ]);
      } else if (ra_hms && dec_dms) {
        aladin.gotoObject(`${ra_hms} ${dec_dms}`);
      } else {
        throw new Error("El entry no trae coordenadas utilizables (ra/dec).");
      }
    }

    // Validación: ¿Aladin cargó?
    if (!window.A || !A.init) {
      setHud("ERROR: Aladin no cargó (A.init no existe). Revisa Network/Console.");
      return;
    }

    setHud("JS OK — esperando A.init…");

    // A.init es promise y puede fallar (ej. WebGL2). :contentReference[oaicite:1]{index=1}
    const timeoutMs = 15000;
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("Timeout esperando A.init")), timeoutMs));

    Promise.race([A.init, timeout])
      .then(() => {
        setHud("A.init OK — creando vista…");

        const aladin = A.aladin("#aladin", {
          target,
          fov,
          survey,
          cooFrame: "ICRS",
          projection: "SIN",
          showReticle: true,
          showCooGrid: true,
          showLayersControl: true,
          showGotoControl: true,
          showZoomControl: true,
          showFullscreenControl: false,
          showShareControl: true
        });

        setHud(`READY — target=${target} fov=${fov} survey=${survey}`);

        if (idParam) {
          setHud(`Cargando entry ${idParam}…`);
          centerOnEntry(aladin, idParam)
            .then(() => setHud(`READY — centered on ${idParam}`))
            .catch((err) => {
              console.error(err);
              setHud("ERROR entry: " + (err?.message || String(err)));
            });
        }
      })
      .catch((err) => {
        console.error(err);
        setHud("ERROR init: " + (err?.message || String(err)));
      });

  })();
  </script>
</body>
</html>
